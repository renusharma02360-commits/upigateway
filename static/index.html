<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UPI Gateway Private - Email Verify</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f6f7fb]">
<header class="bg-[#5a45fe] p-4 text-white flex justify-between">
<b>UPI Gateway - Private</b>
<span class="text-xs bg-white/20 px-3 py-1 rounded-full">EMAIL VERIFY</span>
</header>

<div class="max-w-5xl mx-auto p-4 grid md:grid-cols-2 gap-4">
<div class="bg-white p-6 rounded-2xl shadow">
<h2 class="font-bold text-lg mb-4">Email + UPI Payment</h2>

<label class="text-xs text-gray-500 font-bold">Customer Email</label>
<input id="custEmail" class="w-full border rounded-xl p-3 mt-1 mb-3" placeholder="customer@gmail.com">

<label class="text-xs text-gray-500 font-bold">UPI ID</label>
<input id="upi" class="w-full border rounded-xl p-3 mt-1 mb-3" value="renu@okaxis">

<label class="text-xs text-gray-500 font-bold">Amount</label>
<input id="amt" type="number" class="w-full border rounded-xl p-3 mt-1 mb-3" value="100">

<label class="text-xs text-gray-500 font-bold">Order Note</label>
<input id="note" class="w-full border rounded-xl p-3 mt-1 mb-3" value="ORDER_123">

<button onclick="gen()" class="w-full bg-[#5a45fe] text-white p-3 rounded-xl font-bold">Generate Link + QR</button>
</div>

<div class="bg-white p-6 rounded-2xl shadow text-center">
<h2 class="font-bold mb-3">QR Code</h2>
<div id="qrBox" class="hidden">
<img id="qrImg" class="mx-auto w-64 h-64 border rounded-xl p-2">
<p id="qrLink" class="text-[10px] break-all mt-3 bg-gray-50 p-2 rounded"></p>
<button onclick="verifyEmail()" class="w-full bg-black text-white p-3 rounded-xl mt-4 font-bold">Verify Payment via Email</button>
<div id="vResult" class="mt-3 text-xs p-3 bg-gray-50 rounded-xl text-left">Not checked yet</div>
</div>
<div id="empty" class="py-20 text-gray-400 text-sm">Email daal ke Generate karo</div>
</div>
</div>

<script>
function gen(){
 const upi=document.getElementById('upi').value;
 const amt=document.getElementById('amt').value;
 const note=document.getElementById('note').value;
 const email=document.getElementById('custEmail').value;
 const name='Renu Store';
 const link=`upi://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(name)}&am=${amt}&cu=INR&tn=${encodeURIComponent(note)}`;
 document.getElementById('qrImg').src=`https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(link)}`;
 document.getElementById('qrLink').innerText=`Email: ${email}\nLink: ${link}`;
 document.getElementById('qrBox').classList.remove('hidden');
 document.getElementById('empty').classList.add('hidden');
}
async function verifyEmail(){
 const email=document.getElementById('custEmail').value;
 const resBox=document.getElementById('vResult');
 resBox.innerText='Checking...';
 try{
  const r=await fetch(`/.netlify/functions/api?email=${encodeURIComponent(email)}`);
  const t=await r.text();
  resBox.innerText=t.slice(0,500);
 }catch(e){resBox.innerText='Error '+e}
}
</script>
</body>
</html>
